<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pokerlab · push/fold drills</title>
  <style>
    /* ---------- the room ---------- */
    :root {
      --wall-hi: #2b2320; --wall-lo: #17110f;
      --wood: #5a3a22; --wood-hi: #7a5230; --wood-edge: #2e1c10;
      --felt: #1d6b45; --felt-deep: #114a2e; --felt-line: #2a8557;
      --gold: #d8b25c; --ivory: #f3efe4; --ink: #191512;
      --chip-red: #b03a30; --chip-blue: #33567f; --chip-green: #2e7d52;
      --ok: #6fd096; --bad: #e07b6d;
      font-family: "Avenir Next", Avenir, "Helvetica Neue", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ivory); min-height: 100vh;
      background:
        radial-gradient(120% 90% at 50% -10%, var(--wall-hi), var(--wall-lo) 70%);
      overflow-x: hidden;
    }
    /* wainscot panelling on the back wall */
    .room::before {
      content: ""; position: fixed; inset: auto 0 0 0; height: 34vh; z-index: -1;
      background:
        linear-gradient(#00000000, #00000055),
        repeating-linear-gradient(90deg, #241a14 0 5.5rem, #2b201a 5.5rem 5.65rem);
      border-top: 3px solid #3a2b20;
    }
    header {
      display: flex; align-items: baseline; gap: 1rem;
      padding: 1rem 1.4rem 0.4rem; max-width: 64rem; margin: 0 auto;
    }
    header h1 { font-size: 1.02rem; letter-spacing: .18em; text-transform: uppercase;
                color: var(--gold); margin: 0; font-weight: 600; }
    header .suits { color: var(--ivory); opacity: .5; letter-spacing: .3em; }
    header a { color: var(--ivory); opacity: .65; font-size: .85rem;
               text-decoration: none; border-bottom: 1px solid #ffffff44; }
    header a:hover { opacity: 1; }
    /* RTA toggle: a persistent display preference — it only decides whether
       the solver readout (which rides on every answer) is SHOWN. */
    #rta-toggle { margin-left: auto; font: inherit; font-size: .72rem;
      letter-spacing: .12em; text-transform: uppercase; color: var(--ivory);
      background: transparent; border: 1.5px solid #ffffff55;
      border-radius: 999px; padding: .28rem .9rem; cursor: pointer; opacity: .75; }
    #rta-toggle[aria-pressed="true"] { color: var(--gold);
      border-color: var(--gold); background: #d8b25c1a; opacity: 1; }
    #rta-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ---------- the scene ---------- */
    .scene { position: relative; max-width: 64rem; margin: 0 auto; padding: 0 1rem;
             height: clamp(24rem, 56vw, 33rem); }
    /* hanging lamp + cone of light */
    .lamp { position: absolute; left: 50%; top: -0.4rem; transform: translateX(-50%);
            width: 11rem; height: 3.4rem; z-index: 3; }
    .lamp::before { /* shade */
      content: ""; position: absolute; left: 50%; transform: translateX(-50%);
      top: 1.2rem; width: 9rem; height: 2rem; border-radius: 0 0 4.5rem 4.5rem / 0 0 2rem 2rem;
      background: linear-gradient(#0e3a26, #16543a); box-shadow: inset 0 -0.5rem 1rem #0006;
    }
    .lamp::after { /* cord */
      content: ""; position: absolute; left: 50%; top: -1.2rem; width: 2px; height: 2.5rem;
      background: #000a; transform: translateX(-50%);
    }
    .lightcone { position: absolute; left: 50%; top: 3.2rem; transform: translateX(-50%);
      width: 46rem; max-width: 92%; height: 78%; z-index: 0; pointer-events: none;
      background: radial-gradient(50% 60% at 50% 20%, #ffe9b01c, #ffe9b008 55%, transparent 72%);
      clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }

    /* the dealer, standing behind the far rail */
    .dealer { position: absolute; left: 50%; top: 10%; transform: translateX(-50%);
              width: 7.5rem; height: 6rem; z-index: 1; opacity: .92; }
    .dealer .torso { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 6.6rem; height: 3.6rem; border-radius: 3rem 3rem 0 0;
      background: linear-gradient(#23201e, #131110); } /* vest */
    .dealer .shirt { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 1.8rem; height: 2.9rem; clip-path: polygon(50% 100%, 0 0, 100% 0);
      background: #e8e2d2; }
    .dealer .head { position: absolute; bottom: 3.2rem; left: 50%; transform: translateX(-50%);
      width: 2.1rem; height: 2.4rem; border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#8a6b52, #6d5240); }
    .dealer .tie { position: absolute; bottom: 2.55rem; left: 50%; transform: translateX(-50%);
      width: 1.15rem; height: .5rem; background: #1a1a1a; border-radius: .1rem;
      clip-path: polygon(0 0, 50% 40%, 100% 0, 100% 100%, 50% 60%, 0 100%); }

    /* ---------- the table ---------- */
    .table-rail {
      position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
      width: min(58rem, 94%); height: 76%;
      border-radius: 50% / 46%;
      background: linear-gradient(160deg, var(--wood-hi), var(--wood) 45%, var(--wood-edge));
      box-shadow: 0 1.6rem 3rem #000b, inset 0 .3rem .6rem #ffffff2a, inset 0 -0.6rem 1.2rem #0008;
      z-index: 2;
    }
    .felt {
      position: absolute; inset: 4.5% 3.2%;
      border-radius: 50% / 46%;
      background:
        radial-gradient(75% 70% at 50% 34%, #ffffff10, transparent 60%),
        radial-gradient(100% 100% at 50% 50%, var(--felt), var(--felt-deep) 85%);
      box-shadow: inset 0 .8rem 2.2rem #0007, inset 0 0 0 3px #0d3a25;
    }
    .felt::before { /* betting line */
      content: ""; position: absolute; inset: 17% 15%;
      border: 2px solid var(--felt-line); border-radius: 50% / 46%; opacity: .5;
    }
    .felt::after { /* house mark */
      content: "♠ POKER LAB ♠"; position: absolute; left: 50%; top: 62%;
      transform: translateX(-50%); letter-spacing: .4em; font-size: .68rem;
      color: #ffffff2e; white-space: nowrap;
    }

    /* prize plaques + stacks strip */
    .ladder { position: absolute; left: 50%; top: 13%; transform: translateX(-50%);
      display: flex; gap: .4rem; z-index: 3; flex-wrap: wrap; justify-content: center;
      max-width: 80%; }
    .plaque { background: linear-gradient(#3a2f16, #241d0e); color: var(--gold);
      border: 1px solid #8a6f35; border-radius: .3rem; font-size: .68rem;
      padding: .18rem .55rem; letter-spacing: .04em; white-space: nowrap;
      font-variant-numeric: tabular-nums; }
    .plaque.left { color: var(--ivory); border-color: #ffffff3d; }
    .stacksline { position: absolute; left: 50%; top: 26%; transform: translateX(-50%);
      font-size: .7rem; color: #ffffffb0; letter-spacing: .05em; white-space: nowrap;
      font-variant-numeric: tabular-nums; z-index: 3; }

    /* the prior action, drawn on the felt in the server's words */
    .actionline { position: absolute; left: 50%; top: 32%; transform: translateX(-50%);
      z-index: 3; font-size: .76rem; letter-spacing: .07em; color: #ffe9b0;
      background: #00000055; border: 1px solid #ffe9b03a; border-radius: 999px;
      padding: .2rem .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .actionline:empty { display: none; }

    /* community cards, between the action line and the pot (river drills) */
    .board { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%);
      display: flex; gap: .3rem; z-index: 3; }
    .board:empty { display: none; }
    .board .card { width: 2.2rem; height: 3.1rem; font-size: .72rem; }

    /* pot */
    .pot { position: absolute; left: 50%; top: 40%; transform: translateX(-50%);
      text-align: center; z-index: 3; }
    .chips { display: flex; gap: .28rem; justify-content: center; margin-bottom: .3rem; }
    .chip { width: 1.5rem; height: 1.05rem; border-radius: 50%;
      border: 2px dashed #ffffffc9; box-shadow: 0 3px 0 #0007, 0 4px 0 #ffffff22; }
    .chip.c1 { background: var(--chip-red); } .chip.c2 { background: var(--chip-blue); }
    .chip.c3 { background: var(--chip-green); }
    .pot .amt { font-size: .82rem; color: var(--ivory); letter-spacing: .05em;
      text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
    .pot .ante { font-size: .68rem; color: #ffffff9d; }

    /* seats */
    .seat { position: absolute; transform: translate(-50%, -50%); z-index: 4;
      display: flex; flex-direction: column; align-items: center; gap: .3rem; }
    .seat .chairback { width: 4.6rem; height: 2.1rem; border-radius: 2.2rem 2.2rem .4rem .4rem;
      background: linear-gradient(#4a2f1c, #33200f); box-shadow: inset 0 .25rem .4rem #ffffff21, 0 .4rem .8rem #0009;
      margin-bottom: -1.1rem; }
    .seat .plate { background: #10100fd9; border: 1px solid #ffffff2b; border-radius: 1rem;
      padding: .22rem .8rem; font-size: .74rem; text-align: center; min-width: 4.6rem;
      backdrop-filter: blur(2px); }
    .seat .plate .pos { color: var(--gold); font-weight: 600; letter-spacing: .06em; }
    .seat .plate .stack { color: #ffffffc4; font-variant-numeric: tabular-nums; }
    /* an all-in villain's chips are in the middle, not behind — the plate
       states the state instead of a stack number */
    .seat .plate .allin { color: #ff9d8a; font-weight: 800; font-size: .68rem;
      letter-spacing: .09em; }
    .seat .plate .rbet { color: var(--gold); font-weight: 700; font-size: .68rem;
      letter-spacing: .05em; font-variant-numeric: tabular-nums; }
    .seat.folded { opacity: .45; }
    .seat.folded .plate { border-color: #ffffff17; }
    .seat .plate .foldtag { font-size: .62rem; color: #ffffff73;
      letter-spacing: .08em; font-style: italic; }
    .seat.hero .plate { border-color: var(--gold); box-shadow: 0 0 .9rem #d8b25c44; }
    @media (prefers-reduced-motion: no-preference) {
      .seat.hero.toact .plate { animation: toact 1.6s ease-in-out infinite; }
      @keyframes toact {
        0%, 100% { box-shadow: 0 0 .9rem #d8b25c44; }
        50% { box-shadow: 0 0 1.5rem #d8b25cb0; }
      }
    }
    /* the jam, pushed toward the pot (HU only — seat attribution is a rules
       fact there; multiway seats stay anonymous, the action line carries it) */
    .jamchips { position: absolute; transform: translate(-50%, -50%); z-index: 3;
      display: flex; gap: .22rem; }
    .jamchips .chip { width: 1.2rem; height: .85rem; }
    .seat .cardsback { display: flex; gap: .18rem; margin-top: .1rem; }
    .miniback { width: 1.15rem; height: 1.6rem; border-radius: .18rem;
      background: repeating-linear-gradient(45deg, #7d2f2a 0 3px, #6a2521 3px 6px);
      border: 1.5px solid #e8e2d2; box-shadow: 0 2px 4px #0008; }
    .dbtn { position: absolute; width: 1.55rem; height: 1.55rem; border-radius: 50%;
      background: radial-gradient(#ffffff, #cfc9b8); color: var(--ink);
      font-weight: 800; font-size: .8rem; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 3px 6px #000a; z-index: 5;
      transform: translate(-50%, -50%); }

    /* ---------- RTA readout (over the felt) ---------- */
    .rta { position: absolute; right: 1.1rem; top: 7%; z-index: 6;
      width: 16.5rem; text-align: left; padding: .8rem .95rem;
      background: #0d0b09ee; border: 1px solid #d8b25c66; border-radius: .6rem;
      box-shadow: 0 .8rem 1.6rem #000b; backdrop-filter: blur(3px); }
    .rta h2 { margin: 0 0 .4rem; font-size: .66rem; letter-spacing: .16em;
      text-transform: uppercase; color: var(--gold); font-weight: 600; }
    .rta .best { font-size: .9rem; margin: 0 0 .5rem; }
    .rta .best strong { color: var(--ok); text-transform: uppercase;
      letter-spacing: .05em; }
    .rta table { width: 100%; border-collapse: collapse; font-size: .74rem;
      font-variant-numeric: tabular-nums; }
    .rta th { text-align: left; font-weight: 600; color: #ffffff8c;
      font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
      padding: 0 0 .2rem; }
    .rta th.num, .rta td.num { text-align: right; }
    .rta td { padding: .18rem 0; border-top: 1px solid #ffffff1a;
      color: var(--ivory); }
    .rta tr.best-row td { color: var(--ok); }
    .rta .eps { margin: .45rem 0 0; font-size: .68rem; color: #ffffff9d;
      font-variant-numeric: tabular-nums; }
    .rta .why { margin: .4rem 0 0; font-size: .74rem; line-height: 1.45;
      color: #ffffffd6; }

    /* hero hole cards */
    .holecards { position: absolute; left: 50%; top: 71%; transform: translateX(-50%);
      display: flex; gap: .5rem; z-index: 5; }
    .card { width: 3.6rem; height: 5rem; border-radius: .45rem; background: #fdfcf7;
      color: var(--ink); box-shadow: 0 .5rem 1rem #000a, inset 0 0 0 1px #00000014;
      position: relative; font-family: Georgia, serif; }
    .card .corner { position: absolute; top: .3rem; left: .4rem; line-height: 1;
      font-size: 1.05rem; font-weight: 700; text-align: center; }
    .card .corner .s { font-size: .85rem; display: block; }
    .card .pip { position: absolute; right: .4rem; bottom: .2rem; font-size: 2rem; }
    .card.red { color: #b3261e; }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: deal .35s ease-out backwards; }
      .card:nth-child(2) { animation-delay: .12s; }
      @keyframes deal { from { transform: translateY(-2.2rem) rotate(-6deg); opacity: 0; } }
    }

    /* ---------- console ---------- */
    .console { max-width: 44rem; margin: 0 auto; padding: .6rem 1.2rem 3rem;
      text-align: center; }
    .pickrow { display: flex; gap: 1.2rem; justify-content: center;
      margin: .2rem 0 .4rem; font-size: .78rem; color: #ffffffa8;
      letter-spacing: .05em; }
    .pickrow select { font: inherit; background: #171310; color: var(--ivory);
      border: 1px solid #ffffff33; border-radius: .35rem; padding: .18rem .45rem; }
    .pickrow select:disabled { opacity: .4; }
    .pickrow select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #description { font-size: 1.12rem; font-weight: 600; margin: .4rem 0 .2rem;
      color: var(--ivory); }
    .chipsrow { display: flex; gap: .4rem; justify-content: center; margin: .3rem 0 .8rem; }
    .infochip { font-size: .68rem; letter-spacing: .06em; border: 1px solid #ffffff33;
      border-radius: 999px; padding: .16rem .6rem; color: #ffffffb8;
      background: #ffffff0d; }
    #actions { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center;
      margin: .6rem 0 1rem; }
    #actions button {
      font: inherit; font-weight: 700; font-size: 1.02rem; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ivory); cursor: pointer;
      padding: .7rem 2.1rem; border-radius: 999px; border: 2px dashed #ffffff7d;
      background: radial-gradient(120% 160% at 50% 0%, #ffffff2b, transparent 50%), var(--chip-blue);
      box-shadow: 0 .35rem 0 #00000080, 0 .8rem 1.2rem #0008;
    }
    #actions button:active { transform: translateY(.2rem); box-shadow: 0 .15rem 0 #00000080; }
    #actions button[data-action="jam"], #actions button[data-action="call"] {
      background: radial-gradient(120% 160% at 50% 0%, #ffffff2b, transparent 50%), var(--chip-red); }
    #actions button[data-action="fold"] {
      background: radial-gradient(120% 160% at 50% 0%, #ffffff20, transparent 50%), #3a3a38; }
    #actions button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    /* tier-3 advisory block: study numbers under their caveat, never grades */
    #advisory { margin-top: .55rem; padding: .6rem .8rem; border-radius: .5rem;
      background: #26221fb5; border: 1px solid #ffffff1c; font-size: .78rem; }
    #advisory .caveat { color: #d8b25c; font-style: italic; margin: 0 0 .4rem; }
    #advisory table { border-collapse: collapse; }
    #advisory td { padding: .1rem .6rem .1rem 0;
      font-variant-numeric: tabular-nums; }
    #advisory .eqnote { color: #a89f8e; font-size: .7rem; margin: .35rem 0 0; }

    /* range grid: 13×13, one cell per class, colored by the key's own
       action frequencies (stacked left-to-right) */
    .btnrow { display: flex; gap: .6rem; align-items: center; }
    #range-panel { margin-top: .7rem; }
    #range-grid { display: grid; grid-template-columns: repeat(13, 1fr);
      gap: 2px; max-width: 34rem; }
    #range-grid .rcell { aspect-ratio: 1; display: flex; align-items: center;
      justify-content: center; font-size: .55rem; letter-spacing: .02em;
      color: #fff; border-radius: 3px; text-shadow: 0 1px 1px #000c;
      font-variant-numeric: tabular-nums; }
    #range-grid .rcell.absent { background: #26221f; color: #ffffff38; }
    #range-legend { display: flex; gap: .9rem; margin-bottom: .45rem;
      font-size: .72rem; flex-wrap: wrap; }
    #range-legend .swatch { display: inline-block; width: .8rem;
      height: .8rem; border-radius: 3px; margin-right: .3rem;
      vertical-align: -2px; }
    #range-ctx { font-size: .7rem; color: #a89f8e; font-style: italic;
      overflow-wrap: anywhere; }

    /* tier-2 disclosure: the server's provenance sentence, small but present */
    #provenance { font-size: .72rem; color: #a89f8e; font-style: italic;
      margin: .1rem 0 0; overflow-wrap: anywhere; }
    #provenance:empty { display: none; }

    #action-note { font-size: .78rem; color: #ffffff96; font-style: italic;
      margin: -0.2rem 0 .8rem; min-height: 1rem; }
    #feedback { min-height: 3.4rem; font-size: .98rem; max-width: 40rem; margin: 0 auto;
      line-height: 1.45; }
    #feedback.correct { color: var(--ok); }
    #feedback.incorrect { color: var(--bad); }
    /* tier-3: no right/wrong exists — neutral ink, no verdict color */
    #feedback.neutral { color: var(--ivory); }
    #next { font: inherit; font-size: .88rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold); background: transparent; border: 1.5px solid var(--gold);
      border-radius: 999px; padding: .5rem 1.6rem; cursor: pointer; margin-top: .6rem; }
    #next:hover { background: #d8b25c22; }
    #next:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    @media (max-width: 40rem) {
      .scene { height: 24rem; }
      .card { width: 2.9rem; height: 4rem; }
      .dealer { display: none; }
      .rta { right: .4rem; left: .4rem; width: auto; top: 3%; }
    }
  </style>
</head>
<body>
  <div class="room">
    <header>
      <h1>Poker Lab</h1>
      <span class="suits">♠ ♥ ♣ ♦</span>
      <button id="rta-toggle" aria-pressed="false"
              title="Show the solver readout after each answer">RTA</button>
      <a href="/report">leak report →</a>
    </header>

    <div class="scene">
      <div class="lightcone"></div>
      <div class="lamp"></div>
      <div class="dealer" aria-hidden="true">
        <div class="torso"></div><div class="shirt"></div>
        <div class="head"></div><div class="tie"></div>
      </div>
      <div class="table-rail">
        <div class="felt">
          <div class="ladder" id="ladder"></div>
          <div class="stacksline" id="stacksline"></div>
          <div class="actionline" id="actionline"></div>
          <div class="board" id="board"></div>
          <div class="pot" id="pot"></div>
          <div id="seats"></div>
          <div class="holecards" id="holecards"></div>
        </div>
      </div>
      <aside class="rta" id="rta" hidden aria-live="polite"></aside>
    </div>

    <div class="console">
      <div class="pickrow">
        <label>practice
          <select id="mode">
            <option value="all">everything</option>
            <option value="hu">HU push/fold</option>
            <option value="icm">ICM bubble</option>
            <option value="ring-jam">ring first-in (jam/fold, 3–9 players)</option>
            <option value="ring-defend">ring defend vs jam (3–9 players)</option>
            <option value="open">first-in open (raises priced)</option>
            <option value="resteal">resteal vs raise</option>
            <option value="river">river (solver-graded)</option>
            <option value="multiway">multiway (tier 3 — advisory)</option>
          </select>
        </label>
        <label>position
          <select id="pos"><option value="all">any</option></select>
        </label>
        <label>players
          <select id="players">
            <option value="all">any</option>
            <option value="2">2 (heads-up)</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9 (full ring)</option>
          </select>
        </label>
      </div>
      <p id="description">Loading…</p>
      <div class="chipsrow" id="meta"></div>
      <p id="provenance"></p>
      <div id="actions"></div>
      <p id="action-note"></p>
      <p id="feedback"></p>
      <div id="advisory" hidden></div>
      <div class="btnrow">
        <button id="next">Deal next spot</button>
        <button id="range-btn" disabled
                title="The full 13×13 range this answer key plays — revealed after you answer">show range</button>
      </div>
      <div id="range-panel" hidden>
        <div id="range-legend"></div>
        <div id="range-grid"></div>
        <p id="range-ctx"></p>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
