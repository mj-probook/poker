[project]
name = "pokerlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mj-probook", email = "michael@probook.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "hypothesis>=6.157.0",
    "numpy>=2.5.1",
    "open-spiel>=2.0.1",
    "phevaluator>=0.6.0",
    "pokerkit>=0.7.4",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
pokerlab-web = "pokerlab.web.app:main"
pokerlab-import = "pokerlab.cli:main_import"
pokerlab-batch = "pokerlab.cli:main_batch"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not bench'"
markers = [
    "slow: heavy runs (soak differentials, full benchmarks) — excluded from the fast suite",
    "bench: milestone-exit benchmark runs (full flops25, training runs)",
    "openspiel: cross-checks against open_spiel reference implementations",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
