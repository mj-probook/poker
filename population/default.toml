# Population action-frequency baselines for tier-3 (multiway postflop) grading.
#
# Tier-3 spots have no trustworthy EV reference (CLAUDE.md hard rule: tier-3
# NEVER reports ev_loss). Instead we compare the hero's action mix to this
# population baseline and flag frequency deviations. This is a VERSIONED,
# in-house table (own observations only — nothing vendor-derived); bump
# `version` when the numbers change so gradings stay reproducible.
#
# Keys are "<formation>|<street>" (formation == "<seats>max:<position>"); each
# maps a normalized distribution over action_types (fold/check/call/bet/raise/
# jam). Missing spots -> no baseline (grading records "no population baseline").

